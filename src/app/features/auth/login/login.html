<section class="login-page">
  <div class="login-card app-card">

    <!-- Brand -->
    <div class="login-brand">
      <div class="login-brand-logo">🚗</div>
      <h1>AutoFleet</h1>
      <p>Panel zarządzania flotą</p>
    </div>

    <!-- Form -->
    <div class="login-form-body">

      <h2>Zaloguj się</h2>

      <input
        type="email"
        placeholder="Adres e-mail"
        [(ngModel)]="email"
        autocomplete="email"
      />

      <input
        type="password"
        placeholder="Hasło"
        [(ngModel)]="password"
        autocomplete="current-password"
      />

      @if (error) {
        <div class="login-error">{{ error }}</div>
      }

      <button (click)="login()">
        Zaloguj się →
      </button>

    </div>

    <p class="switch-mode">
      Nie masz konta?
      <a routerLink="/register">Zarejestruj się</a>
    </p>

  </div>
</section>
