@if (loading()) {
  <p class="loading">Ładowanie...</p>
} @else if (car()) {

  <section class="car-detail">

    <app-car-summary [car]="car()!" (updated)="load()" />

    <app-car-gallery [carId]="car()?.carId!" (changed)="load()" />

    <app-car-tabs [carId]="car()!.carId!" [carName]="car()!.brand + ' ' + car()!.model" />

  </section>

}
