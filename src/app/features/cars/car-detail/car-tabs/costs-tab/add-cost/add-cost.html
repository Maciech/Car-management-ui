<div class="overlay" (click)="cancel.emit()"></div>

<div class="panel">

  <div class="panel-header">
    <h3>➕ Dodaj koszt</h3>
  </div>

  <div class="panel-body">

    <div>
      <label>Opis</label>
      <input [(ngModel)]="description" placeholder="np. wymiana oleju, lakierowanie..." />
    </div>

    <div>
      <label>Kwota (zł)</label>
      <input type="number" [(ngModel)]="amount" placeholder="0.00" />
    </div>

    <div>
      <label>Typ wydatku</label>
      <select [(ngModel)]="type" name="type" required>
        <option value="" disabled selected>Wybierz typ wydatku</option>
        @for (expenseType of expenseTypes; track expenseType) {
          <option [value]="expenseType">{{ expenseType }}</option>
        }
      </select>
    </div>

    <div>
      <label>Płatnik</label>
      <input [(ngModel)]="payer" placeholder="Kto zapłacił?" />
    </div>

    <div>
      <label>Data</label>
      <input type="date" [(ngModel)]="date" />
    </div>

  </div>

  <div class="actions">
    <button class="cancel" (click)="cancel.emit()">Anuluj</button>
    <button class="save" (click)="submit()">💾 Zapisz</button>
  </div>

</div>
