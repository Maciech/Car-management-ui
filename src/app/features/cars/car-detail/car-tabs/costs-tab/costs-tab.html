<div class="app-card">

  <div class="costs-header">
  <h3>Koszty</h3>

  <button class="add-btn" (click)="openAdd()">＋ Dodaj koszt</button>
</div>

@if (showAdd()) {
  <app-add-cost
    [carId]="carId"
    [expense]="editingCost()"
    (saved)="onSaved()"
    (cancel)="closeAdd()" />
}
</div>
<div class="app-card">
  <ag-grid-angular
    style="width: 100%; height: 500px;"
    [theme]="myTheme"
    [rowData]="rowData"
    [columnDefs]="columnDefs"
    [pagination]="true"
    [paginationPageSize]="20"
    [gridOptions]="gridOptions">
  </ag-grid-angular>
</div>

<div>
  Suma kosztów: {{expenseSum()}}
</div>
